<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedTrack | Log in</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page-body">
  <header class="topbar login-topbar">
    <a class="brand" href="index.html" aria-label="MedTrack Home">
      <img src="assets/medtrack.png" alt="MedTrack Logo" class="brand-logo" />
    </a>
  </header>

  <main class="page login-page">
    <section class="grid form-layout">
      <article class="panel login-panel">
        <p class="eyebrow">Welcome</p>
        <h1>Log in to MedTrack</h1>

        <form id="loginForm" class="form-grid">
          <label>Username
            <input id="loginUsername" type="text" autocomplete="username" required />
          </label>

          <label>Password
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>

          <div class="form-actions">
            <button class="btn primary" type="submit">Log in</button>
          </div>
        </form>

        <p class="muted" id="loginStatus"></p>
      </article>
    </section>
  </main>

  <div class="login-transition" id="loginTransition" aria-hidden="true">
    <div class="login-transition-card" role="status" aria-live="polite">
      <div class="medtrack-assembly" aria-label="MedTrack loading">
        <span class="logo-module module-one"></span>
        <span class="logo-module module-two"></span>
        <span class="logo-module module-three"></span>
        <span class="logo-module module-four"></span>
        <span class="logo-module module-five"></span>
        <span class="logo-module module-six"></span>
      </div>
      <div class="login-transition-word">MedTrack</div>
      <p>Preparing your workspace</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
