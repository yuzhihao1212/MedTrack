<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedTrack | Logs</title>
  <script src="js/guard.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="app-shell">
<header class="topbar">
  <a class="brand" href="home.html" aria-label="MedTrack Home">
    <img src="assets/medtrack.png" alt="MedTrack Logo" class="brand-logo" />
  </a>

  <button class="app-nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="nav-links">
    <a href="home.html" data-short="H" title="Home">Home</a>
    <a href="dashboard.html" data-short="D" title="Dashboard">Dashboard</a>
    <a href="devices.html" data-short="V" title="Devices">Devices</a>
    <a href="failures.html" data-short="F" title="Failures">Failures</a>
    <a href="maintenance.html" data-short="M" title="Maintenance">Maintenance</a>
    <a class="active" href="logs.html" data-short="L" title="Logs">Logs</a>
    <a href="analytics.html" data-short="A" data-role-only="bme_analyst" title="Analytics">Analytics</a>
  </nav>
</header>

  <main class="page">
    <div class="page-heading">
      <div>
        <p class="eyebrow">Clinical Engineering Logs</p>
        <h1>Operational Logbook</h1>
      </div>
      <button class="btn secondary" id="reloadLogsBtn">Reload</button>
    </div>

    <section class="grid two">
      <article class="panel">
        <h2>Add Technician Note</h2>
        <form id="noteForm" class="form-grid">
          <label>Device Code
            <input id="noteDeviceCode" type="text" placeholder="e.g. DEV-1001" required />
          </label>
          <label>Technician Name
            <input id="technicianName" type="text" placeholder="Technician name" required />
          </label>
          <label>Note
            <textarea id="noteText" rows="4" placeholder="Maintenance observation..." required></textarea>
          </label>
          <button class="btn primary" type="submit">Save Note</button>
        </form>
      </article>

      <article class="panel">
        <h2>Add Event Log</h2>
        <form id="eventForm" class="form-grid">
          <label>Device Code
            <input id="eventDeviceCode" type="text" placeholder="e.g. DEV-1001" required />
          </label>
          <label>Event Type
            <input id="eventType" type="text" placeholder="Failure / Maintenance / Alert" required />
          </label>
          <label>Severity
            <select id="eventSeverity">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Critical</option>
            </select>
          </label>
          <label>Message
            <textarea id="eventMessage" rows="3" required></textarea>
          </label>
          <button class="btn primary" type="submit">Save Event Log</button>
        </form>
      </article>
    </section>

    <section class="grid two">
      <article class="panel">
        <div class="panel-header"><h2>Technician Notes</h2></div>
        <p class="muted" id="notesStatus">Loading notes...</p>
        <div id="notesList" class="document-list"></div>
      </article>

      <article class="panel">
        <div class="panel-header"><h2>Device Event Logs</h2></div>
        <p class="muted" id="eventsStatus">Loading event logs...</p>
        <div id="eventsList" class="document-list"></div>
      </article>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
